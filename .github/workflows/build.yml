name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned rather than macos-latest: `latest` moved from macOS 15 to macOS 26
    # in July 2026, and a toolchain that changes under you turns an unrelated
    # PR red. Bump this deliberately.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # A tag says which version this is; Resources/Info.plist says which
      # version the app will *report*. `scripts/release.sh` bumps the plist and
      # tags in one go, so they agree — but a tag pushed by hand skips it, and
      # nothing downstream notices: the zip builds, the release publishes, the
      # formula bumps, and the shipped app quietly claims the previous version.
      # It is not cosmetic. UpdateCheck compares CFBundleShortVersionString
      # against the newest release, so a stale plist makes every install
      # announce an update to the version it is already running, forever.
      #
      # v0.4.0 shipped exactly that. Fail the tag instead.
      - name: Tag and Info.plist agree on the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          echo "tag=$TAG  Info.plist=$PLIST"
          if [ "$TAG" != "$PLIST" ]; then
            echo "::error::Tag v${TAG} does not match CFBundleShortVersionString ${PLIST}."
            echo "::error::Cut releases with 'scripts/release.sh ${TAG}', which bumps the plist and tags together."
            exit 1
          fi

      - name: Build
        run: swift build

      # Only the offline spikes: the rest need a token and a live account,
      # which CI has neither of. These are pure arithmetic and logic — the
      # status fusion, the actor filter, the rate budget, and the two geometry
      # bugs that are easy to reintroduce.
      - name: Offline regression suite
        run: make spikes-offline

      - name: Build app bundle
        run: make app

      # The packaging path is what `brew install` consumes, so it is exercised
      # on every push rather than discovered to be broken during a release.
      - name: Package the shipping app
        run: scripts/package.sh

      - name: Verify the packaged app is universal and signed
        run: |
          set -euo pipefail
          APP=.build/release/Runway.app
          archs="$(lipo -archs "$APP/Contents/MacOS/Runway")"
          echo "architectures: $archs"
          case "$archs" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "not a universal binary: $archs"; exit 1 ;;
          esac
          codesign --verify --deep --strict "$APP"
          test -f Runway.zip || { echo "Runway.zip missing"; exit 1; }
          # Info.plist has always named an icon; until 0.1.4 nothing on the
          # release path built one, and the copy was guarded by `if [ -f ]`, so
          # every shipped build carried a dangling CFBundleIconFile and showed
          # the generic tile. Nothing failed, which is why it lasted. Assert it.
          test -f "$APP/Contents/Resources/AppIcon.icns" \
            || { echo "bundle has no AppIcon.icns"; exit 1; }
          echo "packaged app OK"

      # `brew install` failed on 0.1.1 with `Errno::ENOENT - Runway.app`: the
      # zip's only top-level entry is the bundle, so Homebrew chdirs INTO
      # Runway.app before running the formula's `install`, and the formula was
      # then looking for Runway.app/Runway.app. Nothing on the packaging side
      # makes that visible, so assert the staged layout here rather than
      # learning about it from a bug report.
      - name: Verify the archive stages the way the formula expects
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          ditto -x -k Runway.zip "$STAGE"
          cd "$STAGE"

          # AbstractDownloadStrategy#chdir, reproduced: brew descends into a
          # lone top-level directory and leaves the formula standing in it.
          shopt -s nullglob
          entries=(*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            echo "brew will chdir into ${entries[0]}"
            cd "${entries[0]}"
          fi

          # Whichever side of that the formula lands on, it has to find a
          # bundle to install — these are exactly its two branches.
          if [ -d Runway.app ]; then
            test -f Runway.app/Contents/MacOS/Runway
          else
            test -f Contents/MacOS/Runway
          fi
          echo "staged layout OK (formula stages in $(pwd))"

      - name: Verify the bundle is well-formed
        run: |
          APP=.build/debug/Runway.app
          test -f "$APP/Contents/MacOS/Runway" || { echo "missing binary"; exit 1; }
          test -f "$APP/Contents/Info.plist"   || { echo "missing Info.plist"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns" || { echo "missing app icon"; exit 1; }
          echo "bundle OK"

      # The formula is Ruby that nothing else in CI would ever execute, so a
      # typo in it would only surface when a user runs `brew install`.
      - name: Check the Homebrew formula parses
        run: |
          ruby -c Formula/runway.rb
          grep -q "^class Runway < Formula" Formula/runway.rb \
            || { echo "formula class name does not match the file name"; exit 1; }

  release:
    # Tag builds publish the prebuilt app as Runway.zip. Without a paid Apple
    # Developer ID it can only be ad-hoc signed, and macOS refuses to open a
    # *downloaded* ad-hoc app ("is damaged") — but that wall is Gatekeeper
    # reacting to com.apple.quarantine, which Homebrew stamps on casks and not
    # on formulae. So the FORMULA unpacks this zip and the app opens on the
    # first try, while the same file fetched from the releases page by hand
    # hits the wall. A cask could not do this. See Formula/runway.rb.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tarball.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Build and package the app
        id: tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/package.sh
          # The formula's url points at THIS file, so the checksum is taken
          # from the exact bytes a user will download. The previous version
          # hashed a locally produced `git archive` while pointing the url at
          # GitHub's auto-generated tag archive — two different files, so
          # `brew install` failed on a checksum mismatch every time.
          SHA256="$(shasum -a 256 Runway.zip | cut -d' ' -f1)"
          shasum -a 256 Runway.zip | tee sha256.txt
          {
            echo "version=$VERSION"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Runway.zip
            sha256.txt
          body: |
            Install with Homebrew:

            ```bash
            brew tap ${{ github.repository_owner }}/runway https://github.com/${{ github.repository }}
            brew install ${{ github.repository }}/runway
            ```

            Already tapped? `brew upgrade runway`.

            No Xcode needed — the app is built here and Homebrew just unpacks
            it.

            Runway is a **formula**, not a cask, and that is deliberate. A cask
            would stamp `com.apple.quarantine` on the app, and Gatekeeper then
            refuses to open anything that is not notarized — which needs a
            $99/year Developer ID. Formulae do not quarantine, so the app opens
            on the first try instead of sending you to System Settings.

            The same reasoning is why you should **not** download `Runway.zip`
            from this page and unzip it by hand: a browser download does get
            quarantined, and will hit that wall. Install through brew.

            Or build from source:

            ```bash
            git clone https://github.com/${{ github.repository }}
            cd runway
            make signing-identity   # once, stops repeated keychain prompts
            make app
            open .build/debug/Runway.app
            ```

            `sha256`: `${{ steps.tarball.outputs.sha256 }}`

  formula:
    # Bump the formula in THIS repository, which is also the tap.
    #
    # No secret, no second repo, no setup: Homebrew reads formulae from a tap's
    # Formula/ directory and `brew tap` takes an explicit URL for repos not
    # named homebrew-*, so the source repo can serve as its own tap. The
    # workflow's own GITHUB_TOKEN can write here, which the previous design —
    # pushing to a separate homebrew-tap repo — specifically could not do.
    #
    # A push made with GITHUB_TOKEN does not start another workflow run, so this
    # cannot loop back into itself.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Need main's history, not just the tag: the commit goes on main.
          fetch-depth: 0

      - name: Rewrite version, url and sha256
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A tag build checks out a detached HEAD. Commit onto main's tip, or
          # the push would try to move main backwards to the tagged commit.
          git fetch origin main
          git checkout -B main FETCH_HEAD

          # The release ASSET, not GitHub's auto-generated tag archive. The
          # sha256 above is computed from this exact file; the auto-generated
          # archive is a different byte stream and would never match.
          export NEW_URL="https://github.com/${REPO}/releases/download/v${VERSION}/Runway.zip"

          # Python rather than sed: `sed -i` needs a mandatory backup suffix on
          # BSD and must not have one on GNU, and this job has been moved
          # between runners before.
          python3 - <<'PY'
          import os, re, sys

          path = "Formula/runway.rb"
          version, sha, url = os.environ["VERSION"], os.environ["SHA256"], os.environ["NEW_URL"]
          src = open(path).read()

          src, n_ver = re.subn(r'^(\s*version\s+)".*"', lambda m: f'{m.group(1)}"{version}"', src, count=1, flags=re.M)
          src, n_url = re.subn(r'^(\s*url\s+)".*"',     lambda m: f'{m.group(1)}"{url}"',     src, count=1, flags=re.M)
          src, n_sha = re.subn(r'^(\s*sha256\s+)".*"',  lambda m: f'{m.group(1)}"{sha}"',      src, count=1, flags=re.M)

          # Fail loudly rather than shipping a formula still pointing at the
          # previous release.
          if (n_ver, n_url, n_sha) != (1, 1, 1):
              sys.exit(f"could not rewrite the formula (version={n_ver}, url={n_url}, sha256={n_sha})")

          open(path, "w").write(src)
          print(f"formula -> v{version}")
          PY

          grep -E '^\s*(version|url|sha256)' Formula/runway.rb

      - name: Commit onto main
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/runway.rb; then
            echo "formula already at v${VERSION} — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "formula: Runway ${VERSION}" -- Formula/runway.rb
          git push origin main
          echo "Formula/runway.rb is now v${VERSION} on main"
