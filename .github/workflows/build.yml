name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Pinned rather than macos-latest: `latest` moved from macOS 15 to macOS 26
    # in July 2026, and a toolchain that changes under you turns an unrelated
    # PR red. Bump this deliberately.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      # Only the offline spikes: the rest need a token and a live account,
      # which CI has neither of. These are pure arithmetic and logic — the
      # status fusion, the actor filter, the rate budget, and the two geometry
      # bugs that are easy to reintroduce.
      - name: Offline regression suite
        run: make spikes-offline

      - name: Build app bundle
        run: make app

      - name: Verify the bundle is well-formed
        run: |
          APP=.build/debug/Runway.app
          test -f "$APP/Contents/MacOS/Runway" || { echo "missing binary"; exit 1; }
          test -f "$APP/Contents/Info.plist"   || { echo "missing Info.plist"; exit 1; }
          plutil -lint "$APP/Contents/Info.plist"
          echo "bundle OK"

      # The formula is Ruby that nothing else in CI would ever execute, so a
      # typo in it would only surface when a user runs `brew install`.
      - name: Check the Homebrew formula parses
        run: |
          ruby -c Formula/runway.rb
          grep -q "^class Runway < Formula" Formula/runway.rb \
            || { echo "formula class name does not match the file name"; exit 1; }

  release:
    # Tag builds publish a source tarball. The app is NOT shipped as a prebuilt
    # binary: without a paid Apple Developer ID it could only be ad-hoc signed,
    # and macOS refuses to open a *downloaded* ad-hoc app ("is damaged"). The
    # Homebrew FORMULA compiles from this tarball on the user's own machine,
    # which sidesteps Gatekeeper entirely. A cask could not do this — casks move
    # prebuilt artefacts, they do not compile. See Formula/runway.rb.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tarball.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Create source tarball
        id: tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="runway-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="runway-$VERSION/" -o "$TARBALL" HEAD
          SHA256="$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)"
          shasum -a 256 "$TARBALL" | tee sha256.txt
          {
            echo "version=$VERSION"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            runway-*.tar.gz
            sha256.txt
          body: |
            Install with Homebrew:

            ```bash
            brew tap ${{ github.repository_owner }}/runway https://github.com/${{ github.repository }}
            brew install ${{ github.repository }}/runway
            ```

            Already tapped? `brew upgrade runway`.

            Runway is a **formula**, not a cask: it compiles on your machine, so
            macOS never quarantines it. That needs a Swift 6 toolchain — install
            Xcode 16 or newer first.

            Or build from source directly:

            ```bash
            git clone https://github.com/${{ github.repository }}
            cd runway
            make signing-identity   # once, stops repeated keychain prompts
            make app
            open .build/debug/Runway.app
            ```

            `sha256`: `${{ steps.tarball.outputs.sha256 }}`

  formula:
    # Bump the formula in THIS repository, which is also the tap.
    #
    # No secret, no second repo, no setup: Homebrew reads formulae from a tap's
    # Formula/ directory and `brew tap` takes an explicit URL for repos not
    # named homebrew-*, so the source repo can serve as its own tap. The
    # workflow's own GITHUB_TOKEN can write here, which the previous design —
    # pushing to a separate homebrew-tap repo — specifically could not do.
    #
    # A push made with GITHUB_TOKEN does not start another workflow run, so this
    # cannot loop back into itself.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Need main's history, not just the tag: the commit goes on main.
          fetch-depth: 0

      - name: Rewrite version, url and sha256
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A tag build checks out a detached HEAD. Commit onto main's tip, or
          # the push would try to move main backwards to the tagged commit.
          git fetch origin main
          git checkout -B main FETCH_HEAD

          export NEW_URL="https://github.com/${REPO}/archive/refs/tags/v${VERSION}.tar.gz"

          # Python rather than sed: `sed -i` needs a mandatory backup suffix on
          # BSD and must not have one on GNU, and this job has been moved
          # between runners before.
          python3 - <<'PY'
          import os, re, sys

          path = "Formula/runway.rb"
          version, sha, url = os.environ["VERSION"], os.environ["SHA256"], os.environ["NEW_URL"]
          src = open(path).read()

          src, n_ver = re.subn(r'^(\s*version\s+)".*"', lambda m: f'{m.group(1)}"{version}"', src, count=1, flags=re.M)
          src, n_url = re.subn(r'^(\s*url\s+)".*"',     lambda m: f'{m.group(1)}"{url}"',     src, count=1, flags=re.M)
          src, n_sha = re.subn(r'^(\s*sha256\s+)".*"',  lambda m: f'{m.group(1)}"{sha}"',      src, count=1, flags=re.M)

          # Fail loudly rather than shipping a formula still pointing at the
          # previous release.
          if (n_ver, n_url, n_sha) != (1, 1, 1):
              sys.exit(f"could not rewrite the formula (version={n_ver}, url={n_url}, sha256={n_sha})")

          open(path, "w").write(src)
          print(f"formula -> v{version}")
          PY

          grep -E '^\s*(version|url|sha256)' Formula/runway.rb

      - name: Commit onto main
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/runway.rb; then
            echo "formula already at v${VERSION} — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "formula: Runway ${VERSION}" -- Formula/runway.rb
          git push origin main
          echo "Formula/runway.rb is now v${VERSION} on main"
